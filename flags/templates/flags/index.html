<!DOCTYPE html>
<html>
<head>

<title>Django Flags</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css" integrity="sha384-TX8t27EcRE3e/ihU7zmQxVncDAy5uIKz4rEkgIXeMed4M0jlfIDPvg6uqKI2xXr2" crossorigin="anonymous">

</head>
<body>

<div class="container">
<div class="row">
  {% for reach in reaches %}<div class="col-md-2">
    {{ reach }}
    {% for advisory in reach.advisories.all %}<div class="card {{ advisory.styling.text }} {{ advisory.styling.background }}">
      <div class="card-body">
        <h5 class="card-title">{{ advisory }}</h5>
        {{ advisory.active_from }} - {{ advisory.active_to }}
      </div>
    </div>{% endfor %}
  </div>{% endfor %}
</div>
</div>

</body>
</html>
